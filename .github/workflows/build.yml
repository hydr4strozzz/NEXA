name: build-nexa
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7' }
      - name: inject obfuscated secrets into config.json
        run: |
          mkdir -p app/src/main/assets
          G_KEY=$(echo -n "${{ secrets.GROQ_API_KEY }}" | base64 -w 0)
          D_KEY=$(echo -n "${{ secrets.DEEPSEEK_API_KEY }}" | base64 -w 0)
          cat > app/src/main/assets/config.json <<JSON
          {
            "groq": "$G_KEY",
            "deepseek": "$D_KEY"
          }
          JSON
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nexa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
